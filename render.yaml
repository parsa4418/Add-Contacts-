services:
  - type: web
    name: telegram-contact-manager
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: TARGET_GROUP
        value: ParsaSelfBot
